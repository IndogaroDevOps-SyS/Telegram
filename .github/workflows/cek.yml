name: CEK FOR CODE TO RELEASE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'

      - name: Inject Telegram API Credentials
        run: |
          touch local.properties
          echo "API_ID=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
          echo "API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (AFAT)
        run: |
          mkdir -p build-logs
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace > build-logs/log-build.log 2>&1

      - name: Upload Build Logs Always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: build-logs/
          retention-days: 30

