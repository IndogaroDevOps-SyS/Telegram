name: Debug

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'

      
      - name: Inject Telegram API Credentials
        env:
          TG_APP_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_APP_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 -c '
          import os
          app_id = os.environ.get("TG_APP_ID", "").strip()
          app_hash = os.environ.get("TG_APP_HASH", "").strip()
          
          print(f"Panjang APP_ID: {len(app_id)}, Panjang APP_HASH: {len(app_hash)}")
          if not app_id or not app_hash:
              raise ValueError("ERROR: Secret GitHub kosong atau tidak terbaca!")
              
          path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          with open(path, "r") as f:
              content = f.read()
              
          content = content.replace("public static int APP_ID = 4;", f"public static int APP_ID = {app_id};")
          content = content.replace("public static String APP_HASH = \"014b35b6184100b085b8d0572f9b5103\";", f"public static String APP_HASH = \"{app_hash}\";")
          
          with open(path, "w") as f:
              f.write(content)
          print("Berhasil menyuntikkan API ID & Hash ke BuildVars.java!")
          '


      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Save Gradle Error Log
        run: ./gradlew TMessagesProj_App:compileAfatDebugJavaWithJavac --no-daemon --stacktrace

      - name: Build Release APK (AFAT)
        run: ./gradlew TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Official-Release-APKss
          path: 'TMessagesProj_App/build/outputs/apk/afat/debug/app.apk'
          retention-days: 7

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: 'TMessagesProj_App/build/outputs/apk/afat/release/app.apk'
          name: Release ${{ github.ref_name }}
          body: "Automated OTA Release for DevOps & Engine Control Build."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
