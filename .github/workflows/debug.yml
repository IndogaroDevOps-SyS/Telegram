name: Debug

off:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'

      - name: Init and Update Submodules
        run: git submodule update --init --recursive --depth=1

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK with Direct CLI Params
        run: |
          ./gradlew TMessagesProj_App:assembleAfatDebug \
          -PAPP_ID="${{ secrets.TELEGRAM_API_ID }}" \
          -PAPP_HASH="${{ secrets.TELEGRAM_API_HASH }}" \
          --stacktrace \


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEBUGING-TELEGRAM
          path: 'TMessagesProj_App/build/outputs/apk/afat/debug/app.apk'
          retention-days: 20
      - name: Print Direct Download Link
        run: |
          echo "===================================================="
          echo " BUILD BERHASIL DIKIRIM!"
          echo " Release Page: https://github.com/${{ github.repository }}/releases"
          echo " Download via GitHub CLI:"
          echo " gh run download ${{ github.run_id }} --dir ./apk-output"
          echo "===================================================="

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: 'TMessagesProj_App/build/outputs/apk/afat/debug/app.apk'
          name: Release ${{ github.ref_name }}
          body: "Automated OTA Release for DevOps & Engine Control Build."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
