name: Build Telegram Android Official ARM64

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'

      - name: Inject Telegram API Credentials
        run: |
          touch local.properties
          echo "API_ID=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
          echo "API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Compile Java Check
        run: ./gradlew :TMessagesProj_App:compileAfatReleaseJavaWithJavac --no-daemon

      - name: Build Release APK (AFAT)
        run: ./gradlew TMessagesProj_App:assembleAfatRelease --stacktrace 

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Official-Release-APKss
          path: 'TMessagesProj_App/build/outputs/apk/afat/release/app.apk'
          retention-days: 7

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: 'TMessagesProj_App/build/outputs/apk/afat/release/app.apk'
          name: Release ${{ github.ref_name }}
          body: "Automated OTA Release for DevOps & Engine Control Build."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
